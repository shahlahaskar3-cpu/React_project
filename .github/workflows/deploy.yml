name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H technical.infolks.info >> ~/.ssh/known_hosts

      - name: Sync build to cPanel
        run: |
          scp -i ~/.ssh/deploy_key -r ./dist/* webfolks@technical.infolks.info:/home/webfolks/public_html/react/

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key